<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101522" />
    <title>Small Focus Game</title>
    <link rel="stylesheet" href="styles.css?v=19" />
    <script src="stars.js?v=3" defer></script>
    <script src="app.js?v=4" defer></script>
  </head>
  <body>
    <main class="focus-app">
      <div class="star-field" aria-hidden="true"></div>
      <section class="start-screen" aria-label="Start">
        <button class="start-button" type="button">start your focus</button>
      </section>
      <section class="menu-screen" aria-label="Game menu" hidden>
        <div class="game-grid">
          <a class="game-card spiral-card" href="wheel/" aria-label="Colourful spiral">
            <img class="menu-game-icon" src="assets/icons/6477916531645017243.svg" alt="" />
            <span class="card-title">Colourful spiral</span>
          </a>
          <a class="game-card planned-card" href="return-to-focus/">
            <span class="planned-label">in planning</span>
            <span class="card-title">return to focus</span>
          </a>
          <a class="game-card planned-card" href="grow-the-vine/">
            <span class="planned-label">in planning</span>
            <span class="card-title">grow the vine</span>
          </a>
          <div class="game-card empty-card" aria-hidden="true"></div>
          <div class="game-card empty-card" aria-hidden="true"></div>
          <div class="game-card empty-card" aria-hidden="true"></div>
          <div class="game-card empty-card" aria-hidden="true"></div>
          <div class="game-card empty-card" aria-hidden="true"></div>
          <div class="game-card empty-card" aria-hidden="true"></div>
        </div>
        <div class="menu-actions">
          <button class="back-button" type="button">← back to start</button>
          <button class="credits-link" type="button">Credits</button>
        </div>
      </section>
      <div class="twinkle-trail" aria-hidden="true"></div>
      <dialog class="credits-dialog" aria-labelledby="credits-title">
        <h2 id="credits-title">Credits</h2>
        <p>Colour palettes from <a href="https://coolors.co/palettes/popular">Coolors</a>.</p>
        <p>Close, automatic-wheel, and score-toggle icons by <a href="https://freeicons.io/profile/714">Raj Dev</a> on <a href="https://freeicons.io">freeicons.io</a>.</p>
        <p>Spiral icon by <a href="https://freeicons.io/profile/5790">ColourCreatype</a> on <a href="https://freeicons.io">freeicons.io</a>.</p>
        <form method="dialog">
          <button class="back-button" type="submit">close</button>
        </form>
      </dialog>
    </main>
  </body>
</html>
