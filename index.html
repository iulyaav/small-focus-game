<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101522" />
    <title>Small Focus Game</title>
    <link rel="stylesheet" href="styles.css?v=9" />
    <script src="stars.js?v=3" defer></script>
    <script src="app.js?v=3" defer></script>
  </head>
  <body>
    <main class="focus-app">
      <div class="star-field" aria-hidden="true"></div>
      <section class="start-screen" aria-label="Start">
        <div class="twinkle-trail" aria-hidden="true"></div>
        <button class="start-button" type="button">start your focus</button>
      </section>
      <section class="menu-screen" aria-label="Game menu" hidden>
        <div class="game-grid">
          <a class="game-card photo-card" href="wheel/" aria-label="the wheel of colour">
            <img src="assets/juliana-malta-YBSszTBENNk-unsplash.jpg" alt="Colorful Ferris wheel against a blue sky" />
            <span class="card-title">the wheel of colour</span>
          </a>
          <div class="game-card empty-card" aria-hidden="true"></div>
          <div class="game-card empty-card" aria-hidden="true"></div>
          <div class="game-card empty-card" aria-hidden="true"></div>
          <div class="game-card empty-card" aria-hidden="true"></div>
          <div class="game-card empty-card" aria-hidden="true"></div>
          <div class="game-card empty-card" aria-hidden="true"></div>
          <div class="game-card empty-card" aria-hidden="true"></div>
          <div class="game-card empty-card" aria-hidden="true"></div>
        </div>
        <div class="menu-actions">
          <button class="back-button" type="button">← back to start</button>
          <button class="credits-link" type="button">Credits</button>
        </div>
      </section>
      <dialog class="credits-dialog" aria-labelledby="credits-title">
        <h2 id="credits-title">Credits</h2>
        <p>Photo by Juliana Malta on <a href="https://unsplash.com">Unsplash</a>.</p>
        <p>Icon by <a href="https://freeicons.io/profile/714">Raj Dev</a> on <a href="https://freeicons.io">freeicons.io</a>.</p>
        <form method="dialog">
          <button class="back-button" type="submit">close</button>
        </form>
      </dialog>
    </main>
  </body>
</html>
