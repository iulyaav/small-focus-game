<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101522" />
    <title>The Wheel of Colour</title>
    <link rel="stylesheet" href="../styles.css?v=9" />
    <script src="../stars.js?v=3" defer></script>
    <script src="wheel.js?v=9" defer></script>
  </head>
  <body>
    <main class="focus-app">
      <div class="star-field" aria-hidden="true"></div>
      <div class="wheel-hint">
        <p>Begin at midnight. Follow the hours.</p>
        <span class="hint-twinkles" aria-hidden="true">
          <span class="twinkle"></span>
          <span class="twinkle"></span>
          <span class="twinkle"></span>
          <span class="twinkle"></span>
        </span>
      </div>
      <a class="close-wheel" href="../#menu" aria-label="Back to game menu" title="Back to game menu">
        <span class="close-icon" aria-hidden="true"></span>
      </a>
      <section class="wheel-screen" aria-label="the wheel of colour">
        <div class="colour-wheel" role="img" aria-label="Twelve transparent rectangles arranged like the hours on a clock"></div>
      </section>
    </main>
  </body>
</html>
