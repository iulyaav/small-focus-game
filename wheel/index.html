<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101522" />
    <title>Colourful spiral</title>
    <link rel="stylesheet" href="../styles.css?v=19" />
    <script src="../stars.js?v=3" defer></script>
    <script src="wheel.js?v=25" defer></script>
  </head>
  <body>
    <main class="focus-app">
      <div class="star-field" aria-hidden="true"></div>
      <div class="wheel-hint">
        <p>Begin at the top. Trace clockwise around the sun.</p>
        <span class="hint-twinkles" aria-hidden="true">
          <span class="twinkle"></span>
          <span class="twinkle"></span>
          <span class="twinkle"></span>
          <span class="twinkle"></span>
        </span>
      </div>
      <a class="close-wheel" href="../#menu" aria-label="Back to game menu" title="Back to game menu">
        <span class="close-icon" aria-hidden="true"></span>
      </a>
      <button class="auto-toggle" type="button" aria-label="Automatic Colourful spiral" aria-pressed="false" title="Automatic Colourful spiral: off">
        <span class="auto-icon" aria-hidden="true"></span>
        <span class="auto-state">off</span>
      </button>
      <section class="wheel-screen" aria-label="Colourful spiral">
        <div class="colour-wheel" role="img" aria-label="Twenty-four rays of different lengths radiating from an open centre"></div>
      </section>
    </main>
  </body>
</html>
