<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101522" />
    <title>The Wheel of Colour</title>
    <link rel="stylesheet" href="../styles.css" />
    <script src="../stars.js" defer></script>
    <script src="wheel.js" defer></script>
  </head>
  <body>
    <main class="focus-app">
      <div class="star-field" aria-hidden="true"></div>
      <a class="close-wheel" href="../#menu" aria-label="Back to game menu" title="Back to game menu">
        <span class="close-icon" aria-hidden="true"></span>
      </a>
      <section class="wheel-screen" aria-label="the wheel of colour">
        <div class="colour-wheel" role="img" aria-label="Twelve transparent rectangles arranged like the hours on a clock"></div>
      </section>
      <footer class="icon-credit">
        X icon by Raj Dev on <a href="https://freeicons.io/icon/business-and-online-icons/x-icon-5301">Freeicons.io</a> · <a href="https://creativecommons.org/licenses/by/3.0/">CC BY 3.0</a>
      </footer>
    </main>
  </body>
</html>
